[workspace]
members = [
    "crates/mb-types",
    "crates/mb-control",
    "crates/mb-wire",
    "crates/mb-transport",
    "crates/mb-runtime",
    "crates/mb-forward",
    "crates/mb-pubsub",
    "bins/mblab-node",
    "bins/mblab",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
bytes = "=1.10.1"
prost = "=0.12.6"
tokio = { version = "=1.37.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
axum = "=0.7.9"
reqwest = { version = "=0.12.24", default-features = false, features = ["json"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[workspace.lints.rust]
unsafe_code = "forbid"
